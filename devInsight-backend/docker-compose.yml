version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: devinsight2-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devinsight2
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./src/main/resources/sql:/docker-entrypoint-initdb.d
    networks:
      - devinsight2-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Spring Boot Application
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: devinsight2-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/devinsight2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-key-at-least-256-bits-long-change-this}
      JWT_EXPIRATION: 86400000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devinsight2-network
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/admin/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devinsight2-frontend
    environment:
      VITE_API_URL: http://localhost:8080/api
      VITE_APP_NAME: DevInsight2
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - devinsight2-network

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: devinsight2-redis
    ports:
      - "6379:6379"
    networks:
      - devinsight2-network
    volumes:
      - redis_data:/data

  # pgAdmin for Database Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: devinsight2-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@devinsight.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - devinsight2-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  devinsight2-network:
    driver: bridge
