  # CORS Configuration (Production)
  cors:
    allowed-origins: ${CORS_ORIGINS:https://devinsight.com}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    allowed-headers: "*"
    exposed-headers: Authorization,X-Total-Count
    allow-credentials: true
    max-age: 3600

logging:
